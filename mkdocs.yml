site_name: GPU Fog of War (UE5)
site_url: https://example.github.io/fow-docs
repo_url: https://github.com/example/fow-docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - content.code.copy
    - navigation.footer
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: indigo    
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - attr_list
  - md_in_html
plugins:
  - search
  - glightbox
  - minify:
      minify_html: true
nav:
  - Home: index.md
  - Fog of War:
      - Quickstart: fog-of-war/quickstart.md
      - Concepts: fog-of-war/concepts.md
      - API: fog-of-war/api.md
      - Performance: fog-of-war/performance.md
      - FAQ: fog-of-war/faq.md
extra:
  social:
    - icon: fontawesome/brands/artstation
      link: https://www.artstation.com/paultorreiter
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/powedl/
copyright: "© {2025} Paul Torreiter"
